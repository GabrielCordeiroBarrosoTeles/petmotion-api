# Só o túnel da Cloudflare chega aqui (nenhuma porta publicada na VPS).
server {
    listen 8095;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 8m;   # foto do pet (o Laravel aceita até 6 MB)

    # fotos dos pets (volume compartilhado com o PHP, só leitura aqui)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass petmotion-php:9095;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
