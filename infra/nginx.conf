# Só o túnel da Cloudflare chega aqui (nenhuma porta publicada na VPS).
server {
    listen 8095;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 8m;   # foto do pet (o Laravel aceita até 6 MB)

    # fotos dos pets (volume compartilhado com o PHP, só leitura aqui)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # WebSocket do passeio ao vivo (Reverb): /app/<chave> (conexão) e /apps/<id>/... (API do Pusher)
    location ~ ^/(app|apps)/ {
        proxy_pass http://petmotion-reverb:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_pass petmotion-php:9095;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
